<!DOCTYPE html>
<html lang="fr">
<head>
    <title>TCL Localisation</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f18">

    <!-- Leaflet (carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { background: #0d0f18; }
        .leaflet-container { background: #0d0f18 !important; }
    </style>
</head>
<body>
    <!-- Spinner de chargement -->
    <div id="loading-spinner" class="loading-spinner">
        <div class="spinner"></div>
        <p>Chargement des données...</p>
    </div>

    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <div class="logo-badge">
                <img src="assets/logo.svg" onerror="this.src='assets/SVG_Icons/lignes.svg'; this.classList.add('svg-ic');">
                <div id="system-status-dot" class="system-status-dot" title="Initialisation..."></div>
            </div>
        </header>

        <!-- Contrôles des couches -->
        <div class="layer-control">
            <div class="layer-toggle active" data-layer="bus" onclick="window.toggleLayer('bus')" title="Bus">
                <div class="layer-toggle-icon"><img src="assets/SVG_Icons/bus.svg" class="svg-ic"></div>
                <span class="layer-toggle-text">Bus</span>
            </div>
            <div class="layer-toggle active" data-layer="stops" onclick="window.toggleLayer('stops')" title="Arrêts">
                <div class="layer-toggle-icon"><img src="assets/SVG_Icons/arrêt.svg" class="svg-ic"></div>
                <span class="layer-toggle-text">Arrêts</span>
            </div>
            <div class="layer-toggle active" data-layer="velov" onclick="window.toggleLayer('velov')" title="Vélo'v">
                <div class="layer-toggle-icon"><img src="assets/SVG_Icons/velo.svg" class="svg-ic"></div>
                <span class="layer-toggle-text">Vélo'v</span>
            </div>
            <div class="layer-toggle active" data-layer="parking" onclick="window.toggleLayer('parking')" title="Parkings">
                <div class="layer-toggle-icon">🅿️</div>
                <span class="layer-toggle-text">Parkings</span>
            </div>
            <div class="layer-toggle" onclick="window.toggleAllLayers()" title="Tout masquer/afficher">
                <div class="layer-toggle-icon">🌍</div>
                <span class="layer-toggle-text">Tout</span>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div id="sidebar" class="sidebar collapsed">
            <div class="sidebar-toggle" onclick="window.toggleSidebar()">
                <span class="sidebar-toggle-icon">▶</span>
            </div>
            <div class="sidebar-content">
                <div class="panel-tabs">
                    <button class="panel-tab active" data-tab="traffic" onclick="window.switchPanelTab('traffic')">
                        <img src="assets/SVG_Icons/trafic.svg" class="svg-ic">
                    </button>
                    <button class="panel-tab" data-tab="accessibility" onclick="window.switchPanelTab('accessibility')">
                        <img src="assets/SVG_Icons/PMR.svg" class="svg-ic">
                    </button>
                    <button class="panel-tab" data-tab="stops" onclick="window.switchPanelTab('stops')">
                        <img src="assets/SVG_Icons/arrêt.svg" class="svg-ic">
                    </button>
                    <button class="panel-tab" data-tab="lines" onclick="window.switchPanelTab('lines')">
                        <img src="assets/SVG_Icons/lignes.svg" class="svg-ic">
                    </button>
                    <button class="panel-tab" data-tab="velov" onclick="window.switchPanelTab('velov')">
                        <img src="assets/SVG_Icons/velo.svg" class="svg-ic">
                    </button>
                    <button class="panel-tab" data-tab="credits" onclick="window.switchPanelTab('credits')">
                        <img src="assets/SVG_Icons/id.svg" class="svg-ic">
                    </button>
                </div>

                <div class="panel-content">
                    <div id="panel-traffic" class="panel-tab-pane active">
                        <div class="tab-header">Perturbations en cours</div>
                        <div id="traffic-list" class="info-list"></div>
                    </div>
                    <div id="panel-accessibility" class="panel-tab-pane">
                        <div class="tab-header">Alertes accessibilité</div>
                        <div id="accessibility-list" class="info-list"></div>
                    </div>
                    <div id="panel-stops" class="panel-tab-pane">
                        <div class="search-bar">
                            <img src="assets/SVG_Icons/loupe.svg" class="svg-ic">
                            <input type="text" id="stop-search" placeholder="Rechercher un arrêt..." oninput="window.filterStops()">
                        </div>
                        <div class="tab-header"><span>Arrêts</span><span id="search-stats">0/0</span></div>
                        <div id="stops-list" class="info-list"></div>
                    </div>
                    <div id="panel-lines" class="panel-tab-pane">
                        <div class="filter-bar">
                            <label><input type="checkbox" id="filter-metro" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/metro.svg" class="svg-ic"> Métro</label>
                            <label><input type="checkbox" id="filter-tram" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/tramway.svg" class="svg-ic"> Tram</label>
                            <label><input type="checkbox" id="filter-tb" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/trolleybus.svg" class="svg-ic"> TramBus</label>
                            <label><input type="checkbox" id="filter-funicular" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/funicular.svg" class="svg-ic"> Funiculaire</label>
                            <label><input type="checkbox" id="filter-navgone" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/navigone.svg" class="svg-ic"> Navigône</label>
                            <label><input type="checkbox" id="filter-chrono" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/chrono.svg" class="svg-ic"> Chrono</label>
                            <label><input type="checkbox" id="filter-bus" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/bus.svg" class="svg-ic"> Bus</label>
                            <label><input type="checkbox" id="filter-navette" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/navette.svg" class="svg-ic"> Navette</label>
                            <label><input type="checkbox" id="filter-pl" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/pleine_lune.svg" class="svg-ic"> Pleine Lune</label>
                            <label><input type="checkbox" id="filter-jd" checked onchange="window.filterLines()"> <img src="assets/SVG_Icons/JD.svg" class="svg-ic"> Junior Direct</label>
                        </div>
                        <div class="tab-header">Lignes disponibles</div>
                        <div id="lines-list" class="info-list"></div>
                    </div>
                    <div id="panel-velov" class="panel-tab-pane">
                        <div class="search-bar">
                            <img src="assets/SVG_Icons/loupe.svg" class="svg-ic">
                            <input type="text" id="velov-search" placeholder="Rechercher une station..." oninput="window.filterVelovStations()">
                        </div>
                        <div class="tab-header"><span>Stations Vélo'v</span><span id="velov-stats">0/0</span></div>
                        <div id="velov-list" class="info-list"></div>
                    </div>
                    <div id="panel-credits" class="panel-tab-pane">
                        <div class="tab-header">À propos</div>
                        <div class="credits-content">
                            <p>Application de localisation en temps réel des transports TCL.</p>
                            <p>Données : <a href="https://data.grandlyon.com" target="_blank">Grand Lyon</a> | <a href="https://www.tcl.fr" target="_blank">TCL</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Carte -->
        <div class="map-container">
            <div id="map"></div>
            <div id="bus-filter-banner" class="filter-banner">
                <span id="bus-filter-label"></span>
                <button class="filter-clear-btn" onclick="window.clearAllFilters()">× Retirer</button>
            </div>
            <div id="stop-filter-banner" class="filter-banner">
                <span id="stop-filter-label"></span>
                <button class="filter-clear-btn" onclick="window.clearAllFilters()">× Retirer</button>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notification-container" class="notification-container"></div>

    <!-- Scripts dans le BON ORDRE -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
