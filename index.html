<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>TCL Localisation | Lyon 🚍🚲🚗</title>
    
    <!-- Leaflet CSS (sans integrity pour éviter les erreurs) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    
    <!-- Leaflet MarkerCluster Default CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
          
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="glass-overlay">
        <div class="loader">
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
            <div class="loader-circle"></div>
        </div>
        <p>Chargement de la carte...</p>
    </div>

    <!-- App Container -->
    <div id="app-container">
        <div id="map"></div>

        <!-- Controls Panel (Glass) -->
        <div id="controls" class="glass-panel">
            <div class="control-header">
                <span class="logo">🚍 TCL Lyon</span>
                <button id="toggleControls" class="icon-btn" title="Réduire">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            
            <div class="control-body">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="transport">
                        <i class="fas fa-bus"></i> Transport
                    </button>
                    <button class="tab-btn" data-tab="info">
                        <i class="fas fa-info-circle"></i> Infos
                    </button>
                </div>

                <div class="tab-content" id="transport-tab">
                    <div class="toggle-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggleBus" checked>
                            <span class="slider"></span>
                            <span class="toggle-label"><i class="fas fa-bus"></i> Bus</span>
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggleVelov" checked>
                            <span class="slider"></span>
                            <span class="toggle-label"><i class="fas fa-bicycle"></i> Vélov</span>
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggleParkings" checked>
                            <span class="slider"></span>
                            <span class="toggle-label"><i class="fas fa-parking"></i> Parkings</span>
                        </label>
                    </div>
                    
                    <div class="stats-container" id="transport-stats">
                        <div class="stat-card">
                            <i class="fas fa-bus"></i>
                            <span id="bus-count">0</span>
                            <small>Bus actifs</small>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-bicycle"></i>
                            <span id="velov-count">0</span>
                            <small>Vélov dispo</small>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-parking"></i>
                            <span id="parking-count">0</span>
                            <small>Places dispo</small>
                        </div>
                    </div>
                </div>

                <div class="tab-content hidden" id="info-tab">
                    <div class="info-section">
                        <h3><i class="fas fa-exclamation-triangle"></i> Alertes Trafic</h3>
                        <div id="traffic-alerts" class="alerts-container">
                            <div class="alert-card warning">
                                <i class="fas fa-exclamation-circle"></i>
                                <div class="alert-content">
                                    <strong>Attention</strong>
                                    <p>Travaux sur la ligne D2 jusqu'au 30/08</p>
                                </div>
                            </div>
                            <div class="alert-card info">
                                <i class="fas fa-info-circle"></i>
                                <div class="alert-content">
                                    <strong>Info</strong>
                                    <p>Nouvelle station Vélov Place Bellecour</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Floating Buttons -->
        <button id="locate-me" class="floating-btn glass-panel" title="Me localiser">
            <i class="fas fa-crosshairs"></i>
        </button>
        <button id="reset-view" class="floating-btn glass-panel" title="Réinitialiser">
            <i class="fas fa-sync"></i>
        </button>

        <!-- Legend -->
        <div id="legend" class="glass-panel legend-panel">
            <h4><i class="fas fa-map"></i> Légende</h4>
            <div class="legend-item">
                <div class="legend-icon bus"></div>
                <span>Bus</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon velov"></div>
                <span>Vélov</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon parking"></div>
                <span>Parking</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS (MUST be loaded BEFORE MarkerCluster) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet MarkerCluster (depends on Leaflet) -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <!-- Custom scripts -->
    <script src="config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
